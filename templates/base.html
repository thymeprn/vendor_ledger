<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Vendor Ledger{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;500;600;700&family=Baloo+2:wght@700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="site-header">
  <a href="{{ url_for('index') }}" class="brand">
    <span class="brand-word brand-word-1">Vendor</span>
    <span class="brand-dot"></span>
    <span class="brand-word brand-word-2">Ledger</span>
  </a>
  <a href="{{ url_for('new_entry') }}" class="btn-new">+ Log transaction</a>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
